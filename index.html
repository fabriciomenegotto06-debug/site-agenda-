<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda de salas</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#dde1e8;--ac:#2f6fed;--acbg:#e6eefd;--ok:#e8f5ec;--okt:#1d6b3a;--danger:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--tx:#e8ebf1;--mut:#9aa3b5;--bd:#2e3542;--ac:#6b9bff;--acbg:#23304d;--ok:#1f3326;--okt:#7fd69b;--danger:#ff8a7a;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:14px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.head h2{font-size:17px;margin:0;text-transform:capitalize}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:12px;color:var(--mut);text-align:center;padding:2px 0}
.day{min-height:64px;border:1px solid var(--bd);border-radius:8px;padding:4px;cursor:pointer;font-size:13px;overflow:hidden}
.day.out{visibility:hidden;cursor:default}
.day.today{border-color:var(--ac)}
.day.sel{background:var(--acbg);border-color:var(--ac)}
.chip{display:block;font-size:10px;background:var(--ok);color:var(--okt);border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.item button{color:var(--danger)}
.msg{color:var(--danger);font-size:13px;margin-top:6px;min-height:16px}
.mut{color:var(--mut);font-size:14px}
@media (max-width:520px){.day{min-height:52px;font-size:12px}.chip{font-size:9px}}
</style>
</head>
<body>
<main>
<h1>Agenda de salas</h1>
<div class="mut" id="status" style="margin-bottom:8px">Conectando à agenda…</div>
<div class="card">
  <div class="head">
    <button id="prev" aria-label="Mês anterior">&larr;</button>
    <h2 id="title"></h2>
    <button id="next" aria-label="Próximo mês">&rarr;</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="card">
  <strong id="seldate">Clique em uma data</strong>
  <div id="list"></div>
  <div class="row" id="form" hidden>
    <select id="prof"></select>
    <select id="sala"></select>
    <span class="mut">das</span><select id="ini"></select><span class="mut">às</span><select id="fim"></select>
    <button class="pri" id="add">Adicionar</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { initializeFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCLtzRwSQY0VH68BE1TBO_9gFPjM1T5VtM",
  authDomain: "agenda-salas-7ba08.firebaseapp.com",
  projectId: "agenda-salas-7ba08",
  storageBucket: "agenda-salas-7ba08.firebasestorage.app",
  messagingSenderId: "697860953448",
  appId: "1:697860953448:web:ba4371359b8dace1d772dd",
  measurementId: "G-9LQ276B4W2"
};

// Os números 0 a 4 guardados no banco correspondem à posição destes nomes.
// Não mude a ordem nem a quantidade sem avisar: as regras do banco aceitam só 0 a 4.
const PROFISSIONAIS = ["Sandra", "Fabiane", "Manoel", "Aline", "Carol"];
const SALAS = ["Conectar", "Cuidar", "Florescer", "Evoluir", "Acolher"];

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
const reservas = collection(db, "reservas");

const $ = (id) => document.getElementById(id);
let data = {};
let sel = null;
const today = new Date();
let cur = new Date(today.getFullYear(), today.getMonth(), 1);

const iso = (y, m, d) => y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
const fmt = (m) => Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0");
const hr = (r) => fmt(r.a) + "–" + fmt(r.b) + " ";

PROFISSIONAIS.forEach((p, i) => $("prof").add(new Option(p, i)));
SALAS.forEach((s, i) => $("sala").add(new Option(s, i)));
for (let t = 480; t <= 1200; t += 30) {
  if (t < 1200) $("ini").add(new Option(fmt(t), t));
  if (t > 480) $("fim").add(new Option(fmt(t), t));
}
$("fim").value = 540;

function setMsg(t) { $("msg").textContent = t; }

function render() {
  const y = cur.getFullYear(), m = cur.getMonth();
  $("title").textContent = cur.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  const g = $("grid"); g.innerHTML = "";
  ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"].forEach((n) => {
    const d = document.createElement("div"); d.className = "dow"; d.textContent = n; g.appendChild(d);
  });
  const first = new Date(y, m, 1).getDay(), n = new Date(y, m + 1, 0).getDate();
  for (let i = 0; i < first; i++) { const e = document.createElement("div"); e.className = "day out"; g.appendChild(e); }
  const todayKey = iso(today.getFullYear(), today.getMonth(), today.getDate());
  for (let d = 1; d <= n; d++) {
    const k = iso(y, m, d), c = document.createElement("div");
    c.className = "day" + (k === todayKey ? " today" : "") + (k === sel ? " sel" : "");
    const num = document.createElement("div"); num.textContent = d; c.appendChild(num);
    (data[k] || []).forEach((r) => {
      const s = document.createElement("span"); s.className = "chip";
      s.textContent = hr(r) + SALAS[r.s] + " · " + PROFISSIONAIS[r.p];
      c.appendChild(s);
    });
    c.onclick = () => { sel = k; setMsg(""); render(); };
    g.appendChild(c);
  }
  renderPanel();
}

function renderPanel() {
  if (!sel) { $("seldate").textContent = "Clique em uma data"; $("list").innerHTML = ""; $("form").hidden = true; return; }
  const p = sel.split("-");
  $("seldate").textContent = new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  $("form").hidden = false;
  const l = $("list"); l.innerHTML = "";
  const arr = data[sel] || [];
  if (!arr.length) { const e = document.createElement("p"); e.className = "mut"; e.textContent = "Nenhuma sala registrada neste dia."; l.appendChild(e); }
  arr.forEach((r) => {
    const row = document.createElement("div"); row.className = "item";
    const sp = document.createElement("span");
    sp.textContent = hr(r) + "— " + SALAS[r.s] + " — " + PROFISSIONAIS[r.p];
    const b = document.createElement("button"); b.textContent = "Remover";
    b.onclick = async () => {
      try { await deleteDoc(doc(db, "reservas", r.id)); setMsg(""); }
      catch (e) { setMsg("Não foi possível remover. Tente de novo."); }
    };
    row.appendChild(sp); row.appendChild(b); l.appendChild(row);
  });
}

$("add").onclick = async () => {
  if (!sel) return;
  const pi = +$("prof").value, si = +$("sala").value, a = +$("ini").value, b = +$("fim").value;
  if (b <= a) { setMsg("O horário final precisa ser depois do inicial."); return; }
  for (const r of (data[sel] || [])) {
    if (a < r.b && r.a < b) {
      if (r.s === si) { setMsg(SALAS[si] + " já está ocupada nesse horário (" + PROFISSIONAIS[r.p] + ", " + fmt(r.a) + " às " + fmt(r.b) + ")."); return; }
      if (r.p === pi) { setMsg(PROFISSIONAIS[pi] + " já está na " + SALAS[r.s] + " nesse horário."); return; }
    }
  }
  const id = sel + "_" + si + "_" + a;
  try {
    await setDoc(doc(db, "reservas", id), { date: sel, s: si, p: pi, a: a, b: b });
    setMsg("");
  } catch (e) {
    setMsg("Não foi possível salvar. Verifique a conexão e tente de novo.");
  }
};

$("prev").onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth() - 1, 1); render(); };
$("next").onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); render(); };

render();

const timer = setTimeout(() => {
  $("status").textContent = "Ainda não foi possível alcançar a agenda. Os dados podem estar desatualizados.";
}, 10000);

onSnapshot(reservas, (snap) => {
  clearTimeout(timer);
  const d = {};
  snap.docs.forEach((x) => {
    const v = x.data();
    if (v && v.date) (d[v.date] = d[v.date] || []).push({ id: x.id, p: v.p, s: v.s, a: v.a, b: v.b });
  });
  Object.keys(d).forEach((k) => d[k].sort((x, y) => (x.a - y.a) || (x.s - y.s)));
  data = d;
  $("status").textContent = "Agenda compartilhada: as alterações aparecem para todos.";
  render();
}, () => {
  clearTimeout(timer);
  $("status").textContent = "Não foi possível carregar a agenda. Verifique as regras do banco e a conexão.";
});
</script>
</body>
</html>
